syntax = "proto3";
package Fantasy.Network.Message;
// 协议分为:
// ProtoBuf:可以在Outer和Inner文件里使用。
// MemoryPack:可以在Outer和Inner文件里使用。
// 使用方式:
// 在message协议上方添加// Protocol+空格+协议名字
// 例如:// Protocol ProtoBuf 或 // Protocol MemoryPack
message C2G_TestMessage // IMessage
{
	string Tag = 1;
}
message C2G_TestRequest // IRequest,G2C_TestResponse
{
	string Tag = 1;
}
message G2C_TestResponse // IResponse
{
	string Tag = 1;
}
message C2G_JoinWorldRequest // IRequest,G2C_JoinWorldResponse
{
}
message G2C_JoinWorldResponse // IResponse
{
	bool Success = 1;
	int64 EntityId = 2;
	int32 CurrentX = 3;
	int32 CurrentY = 4;
	string Reason = 5;
}
message C2G_MoveRequest // IRequest,G2C_MoveResponse
{
	int64 EntityId = 1;
	int32 TargetX = 2;
	int32 TargetY = 3;
	int64 ClientTick = 4;
	int64 ClientInputId = 5;
	int64 BeatTick = 6;
	int32 Direction = 7;
}
message G2C_MoveResponse // IResponse
{
	bool Success = 1;
	int64 EntityId = 2;
	int32 FinalX = 3;
	int32 FinalY = 4;
	int32 MoveErrorCode = 5;
	string Reason = 6;
	int64 ClientTick = 7;
	int64 ClientInputId = 8;
	int64 BeatTick = 9;
	int32 InputStatus = 10;
	int32 Direction = 11;
}
message C2G_PlayerInputRequest // IRequest,G2C_PlayerInputResponse
{
	int64 EntityId = 1;
	int64 ClientInputId = 2;
	int64 BeatTick = 3;
	int32 Direction = 4;
	int64 ClientTick = 5;
	int32 InputKind = 6;
	int32 InputSourceKind = 7;
	int32 RhythmJudge = 8;
	int32 TargetHintKind = 9;
	int64 TargetEntityId = 10;
	int32 TargetX = 11;
	int32 TargetY = 12;
	int64 SampleTimeMs = 13;
}
message G2C_PlayerInputResponse // IResponse
{
	bool Success = 1;
	int64 EntityId = 2;
	int32 FinalX = 3;
	int32 FinalY = 4;
	int32 MoveErrorCode = 5;
	string Reason = 6;
	int64 ClientTick = 7;
	int64 ClientInputId = 8;
	int64 BeatTick = 9;
	int32 InputStatus = 10;
	int32 Direction = 11;
}
message C2G_RegisterMoveObserverRequest // IRequest,G2C_RegisterMoveObserverResponse
{
	int64 EntityId = 1;
}
message G2C_RegisterMoveObserverResponse // IResponse
{
	bool Success = 1;
	int64 EntityId = 2;
	int32 CurrentX = 3;
	int32 CurrentY = 4;
	string Reason = 5;
}
message G2C_EntityMovedNotify // IMessage
{
	int64 EntityId = 1;
	int32 FinalX = 2;
	int32 FinalY = 3;
	int64 ServerTick = 4;
	int64 ClientTick = 5;
}
message G2C_WorldEntityState
{
	int64 EntityId = 1;
	int32 ConfigId = 2;
	int32 ArchetypeId = 3;
	int32 EntityTarget = 4;
	int32 X = 5;
	int32 Y = 6;
	int32 Direction = 7;
	bool HasCollider = 8;
	bool Blocking = 9;
	bool Bouncable = 10;
	bool AutoMove = 11;
	bool PlayerControlled = 12;
	bool Pushable = 13;
	int32 PortLocalPorts = 14;
	bool HasMovementPermission = 15;
	bool CanMove = 16;
	bool CanBePushed = 17;
	int32 AutoMoveIntervalTicks = 18;
	bool RotatePivot = 19;
}
message G2C_PresentationFactMember
{
	int64 EntityId = 1;
	int32 FromX = 2;
	int32 FromY = 3;
	int32 ToX = 4;
	int32 ToY = 5;
	int32 FromDirection = 6;
	int32 ToDirection = 7;
	int32 FromPortLocalPorts = 8;
	int32 ToPortLocalPorts = 9;
}
message G2C_PresentationFactImpact
{
	int64 BlockerEntityId = 1;
	int64 ImpactMemberId = 2;
	int32 ImpactFromX = 3;
	int32 ImpactFromY = 4;
	int32 ImpactToX = 5;
	int32 ImpactToY = 6;
	int32 PushDirection = 7;
}
message G2C_PresentationFact
{
	int64 FactId = 1;
	int64 ServerTick = 2;
	int32 FactType = 3;
	int32 ResultKind = 4;
	int64 SourceActionId = 5;
	int64 ClientInputId = 6;
	int64 SourceEntityId = 7;
	repeated int64 SubjectEntityIds = 8;
	int32 FromX = 9;
	int32 FromY = 10;
	int32 ToX = 11;
	int32 ToY = 12;
	int32 Direction = 13;
	int64 StartTick = 14;
	int64 ContactTick = 15;
	int64 EndTick = 16;
	double ContactProgress = 17;
	int32 EffectiveCostTicks = 18;
	int64 PivotEntityId = 19;
	int32 PivotX = 20;
	int32 PivotY = 21;
	int32 RotateDirection = 22;
	repeated G2C_PresentationFactMember Members = 23;
	repeated G2C_PresentationFactImpact Impacts = 24;
}
message G2C_WorldSnapshotNotify // IMessage
{
	int64 ServerTick = 1;
	repeated G2C_WorldEntityState Entities = 2;
}
message G2C_WorldDeltaNotify // IMessage
{
	int64 ServerTick = 1;
	repeated G2C_WorldEntityState Entities = 2;
	repeated int64 RemovedEntityIds = 3;
	repeated G2C_PresentationFact PresentationFacts = 4;
}
message C2G_DebugSpawnEntityRequest // IRequest,G2C_DebugSpawnEntityResponse
{
	int64 EntityId = 1;
	int32 ConfigId = 2;
	int32 X = 3;
	int32 Y = 4;
	int32 Direction = 5;
	int64 PlayerId = 6;
	int32 AutoMoveIntervalTicks = 7;
	bool RotatePivot = 8;
}
message G2C_DebugSpawnEntityResponse // IResponse
{
	bool Success = 1;
	int64 EntityId = 2;
	string Reason = 3;
}
message C2G_DebugMoveEntityRequest // IRequest,G2C_DebugMoveEntityResponse
{
	int64 EntityId = 1;
	int32 TargetX = 2;
	int32 TargetY = 3;
}
message G2C_DebugMoveEntityResponse // IResponse
{
	bool Success = 1;
	int64 EntityId = 2;
	int32 FinalX = 3;
	int32 FinalY = 4;
	string Reason = 5;
}
message C2G_DebugRemoveEntityRequest // IRequest,G2C_DebugRemoveEntityResponse
{
	int64 EntityId = 1;
}
message G2C_DebugRemoveEntityResponse // IResponse
{
	bool Success = 1;
	int64 EntityId = 2;
	string Reason = 3;
}
message C2G_DebugSetEntityTagRequest // IRequest,G2C_DebugSetEntityTagResponse
{
	int64 EntityId = 1;
	int32 Tag = 2;
	bool Enabled = 3;
}
message G2C_DebugSetEntityTagResponse // IResponse
{
	bool Success = 1;
	int64 EntityId = 2;
	int32 Tag = 3;
	bool Enabled = 4;
	string Reason = 5;
}
message C2G_DebugApplyRuntimeEffectRequest // IRequest,G2C_DebugApplyRuntimeEffectResponse
{
	int64 EntityId = 1;
	int32 EffectKind = 2;
	int32 AutoMoveIntervalTicks = 3;
	int32 PortLocalPorts = 4;
	int64 ExpireTick = 5;
}
message G2C_DebugApplyRuntimeEffectResponse // IResponse
{
	bool Success = 1;
	int64 EntityId = 2;
	int32 EffectKind = 3;
	int64 RuntimeEffectId = 4;
	string Reason = 5;
}
message C2G_DebugRemoveRuntimeEffectRequest // IRequest,G2C_DebugRemoveRuntimeEffectResponse
{
	int64 EntityId = 1;
	int32 EffectKind = 2;
	int64 RuntimeEffectId = 3;
}
message G2C_DebugRemoveRuntimeEffectResponse // IResponse
{
	bool Success = 1;
	int64 EntityId = 2;
	int32 EffectKind = 3;
	int64 RuntimeEffectId = 4;
	string Reason = 5;
}
